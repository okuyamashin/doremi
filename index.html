<!doctype html>
<html lang="ja">
<head>

<style>
/* Layout: one narrow column, three screens (マイク → 録る → 再生) that replace each other */
:root {
  --bg: #fdf5f7;
  --panel: #ffffff;
  --fg: #2a1f2d;
  --muted: #7a6a78;
  --line: #f0dbe3;
  --pink: #d8366e;
  --pink-ink: #ffffff;
  --sky: #6f9fd8;
  --ok: #1f9a68;
  --soft: #fbe6ee;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1724; --panel: #251f31; --fg: #f4ecf2; --muted: #b3a5b5; --line: #3a3048;
    --pink: #ff6f9f; --pink-ink: #1b1724; --sky: #8fb8ee; --ok: #46d39a; --soft: #34263d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 500; font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 40px);
}
main { max-width: 560px; margin: 0 auto; }
.screen { display: grid; gap: 22px; }
h1 { font-weight: 900; font-size: clamp(38px, 11vw, 56px); line-height: 1.1; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 span { color: var(--pink); }
.lead { margin: 0; font-size: 17px; text-wrap: pretty; }
.fine { margin: 0; color: var(--muted); font-size: 13px; }
a { color: var(--pink); }
button {
  font: inherit; font-weight: 900; border: 0; cursor: pointer; border-radius: 999px;
  background: var(--pink); color: var(--pink-ink); min-height: 64px; padding: 0 32px; font-size: 20px;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--pink) 55%, #000);
  transition: transform .08s, box-shadow .08s;
}
button:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--pink) 55%, #000); }
button.ghost {
  background: transparent; color: var(--pink); box-shadow: none; min-height: 48px; font-size: 15px; font-weight: 700;
  padding: 0 12px; margin-top: -10px; text-decoration: underline; text-underline-offset: 4px;
}

button:focus-visible { outline: 3px solid var(--sky); outline-offset: 4px; }
.cover { width: 100%; height: auto; aspect-ratio: 1731 / 909; object-fit: cover; border-radius: 18px; display: block; background: var(--soft); }

/* 録る */
.target { display: grid; justify-items: center; gap: 4px; padding: 18px 0 6px; }
.target .note { font-weight: 900; font-size: 96px; line-height: 1; color: var(--muted); transition: color .15s; }
.target .note.ok { color: var(--ok); }
.target .sub { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
canvas { display: block; width: 100%; height: 64px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.status { margin: 0; text-align: center; font-weight: 700; font-size: 18px; min-height: 3.5em; text-wrap: balance; }
.status.ok { color: var(--ok); }

/* 再生 */
.player { display: grid; gap: 14px; justify-items: center; }
.player button { width: min(100%, 320px); }
.progress { width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--pink); }
.time { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.songhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.songhead h2 { margin: 0; font-size: 24px; font-weight: 900; }
.songhead span { color: var(--muted); font-size: 14px; }
.lyrics { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 8px; }
.lyrics h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.lyrics p { margin: 0 0 22px; font-size: 16px; line-height: 2; }
.lyrics b { color: var(--pink); font-weight: 900; }
.escape { border-top: 1px dashed var(--line); padding-top: 18px; display: grid; gap: 6px; }
.escape p { margin: 0; }
.escape a { font-weight: 900; font-size: 17px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { button, .target .note { transition: none; } }
</style>

<body>
<main>

  <!-- 1. はじめ -->
  <section class="screen" id="scStart">
    <h1>いらない<br><span>コーラス</span></h1>
    <img class="cover" src="cover.webp" alt="ドレミの恋のジャケット。窓辺で微笑む女性と夕暮れの街。" width="1200" height="630">
    <p class="lead">名曲「ドレミの恋」に、あなたの「ドー」を勝手に足して、台無しにします。</p>
    <button id="micBtn">マイクをオン</button>
    <button id="sampleBtn" class="ghost">サンプルのドだけちょうだい（ごめん、許して）</button>

  <!-- 2. 録る -->
  <section class="screen" id="scRec" hidden>

      <div class="note" id="noteName">ド</div>

  </section>

  <!-- 3. 再生 -->
  <section class="screen" id="scPlay" hidden>
    <img class="cover" src="cover.webp" alt="ドレミの恋のジャケット。窓辺で微笑む女性と夕暮れの街。" width="1200" height="630">
    <div class="songhead"><h2>ドレミの恋</h2><span>with いらないコーラス（あなた）</span></div>
    <div class="player">
      <button id="playBtn" disabled>準備中…</button>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <div class="time" id="time">0:00 / 2:26</div>
    </div>
    <div class="lyrics" id="lyrics"></div>
    <div class="escape">
      <p>なんで自分の声を入れて台無しにしなければいけないのか、と思った方へ。</p>
      <a href="https://suno.com/s/KmM0VyzcKSubFCMv" target="_blank" rel="noopener">自分の声とかいらない人はこちら →</a>
    </div>
  </section>

</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const C4 = 261.6256;
const JA = ["ド", "ド#", "レ", "レ#", "ミ", "ファ", "ファ#", "ソ", "ソ#", "ラ", "ラ#", "シ"];
let ctx = null;
function audio() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
function show(id) { for (const s of ["scStart", "scRec", "scPlay"]) $(s).hidden = s !== id; window.scrollTo(0, 0); }

// ---------- 歌詞 ----------
const LYRICS = `[Verse 1]
ドアの向こうで　朝がほどけて
レースのカーテン　風に揺れた
ミルク色した　雲を見上げて
ファインダー越しに　君を探す

[Pre-Chorus]
ソーダの泡みたいに
ラストの言葉が消えて
シグナル変わる前に
もう一度だけ　名前呼んだ

[Chorus]
ドキドキしてる　まだ好きなんだ
レコードみたいに　同じ場所で
ミライなんて　わからないけど
ファーストテイクの恋でいい

ソッポ向いた　昨日さえも
ラメみたいに　光り出す
シアワセって　たぶん今
ドアの向こうへ　走り出すこと

[Verse 2]
ドーナツ半分　分けた帰り道
レモンの月が　ビルに沈む
ミスした言葉　笑ってくれた
ファミレスの灯り　少しまぶしい

[Bridge]
ソロみたいな夜も
ラジオから君の声
シンプルな願いだけ
胸の奥で　鳴り続けてる

[Final Chorus]
ドキドキしてる　まだ好きなんだ
レインコートの雨の匂い
ミライなんて　選べないけど
ファーストライトが街を染める

ソッポ向いた　昨日さえも
ラブソングに　変えてみせる
シアワセって　たぶん今
ドアの向こうへ　走り出すこと`;
const SECTION_JA = { "Verse 1": "1番", "Pre-Chorus": "Bメロ", "Chorus": "サビ", "Verse 2": "2番", "Bridge": "Cメロ", "Final Chorus": "ラストサビ" };
function renderLyrics() {
  const host = $("lyrics");
  let html = "";
  for (const block of LYRICS.split(/\n\s*\n/)) {
    const lines = block.split("\n");
    const m = lines[0].match(/^\[(.+)\]$/);
    if (m) { html += `<h3>${SECTION_JA[m[1]] || m[1]}</h3>`; lines.shift(); }
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    html += "<p>" + lines.map((l) => {
      const k = l.match(/^(ド|レ|ミ|ファ|ソ|ラ|シ)/);
      return k ? `<b>${k[1]}</b>${esc(l.slice(k[1].length))}` : esc(l);
    }).join("<br>") + "</p>";
  }
  host.innerHTML = html;
}

// ---------- ピッチ検出 (YIN) ----------
function detectPitch(buf, sr) {
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < 0.01) return 0;
  const W = Math.floor(buf.length / 2);
  const tauMin = Math.floor(sr / 1100), tauMax = Math.min(W - 1, Math.floor(sr / 65));
  const d = new Float32Array(tauMax + 1);
  for (let tau = 1; tau <= tauMax; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
    d[tau] = s;
  }
  let run = 0; d[0] = 1;
  for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; d[tau] = run ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (d[t] < 0.12) { while (t + 1 <= tauMax && d[t + 1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 0) return 0;
  const a = d[tau - 1] ?? d[tau], b = d[tau], c = d[tau + 1] ?? d[tau];
  const den = a + c - 2 * b;
  return sr / (tau + (den ? (a - c) / (2 * den) : 0));
}
function analyse(f) {
  const semis = 12 * Math.log2(f / C4);
  const n = Math.round(semis);
  return { name: JA[((n % 12) + 12) % 12], centsC: (semis - Math.round(semis / 12) * 12) * 100 };
}

// ---------- 録音 ----------
const RING_SEC = 8, HOLD = 0.7, MAX_RUN = 2.2, PRE = 0.15, POST = 0.08, TOL = 30;
let mic = null, ring = null, total = 0, runInfo = null, latest = null, refUntil = 0, captured = false;
const hist = [];
function ringWrite(x) { const L = ring.length; for (let i = 0; i < x.length; i++) ring[(total + i) % L] = x[i]; total += x.length; }
function ringRead(a, b) { const L = ring.length, out = new Float32Array(b - a); for (let i = a; i < b; i++) out[i - a] = ring[i % L]; return out; }

async function startMic() {
  const c = audio();
  await c.resume();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    $("micBtn").textContent = "マイクを使えませんでした";
    document.querySelector("#scStart .fine").textContent = "ブラウザの設定でマイクを許可してから、ページを読み込み直してください。台無しにしたくない方は、このまま原曲をどうぞ。";
    return;
  }
  show("scRec");
  loadSong(); // 録っている間に曲を読み込んでおく
  const src = c.createMediaStreamSource(stream);
  const proc = c.createScriptProcessor(2048, 1, 1);
  const sink = c.createGain(); sink.gain.value = 0;
  ring = new Float32Array(Math.floor(c.sampleRate * RING_SEC)); total = 0;
  proc.onaudioprocess = (e) => onBlock(e.inputBuffer.getChannelData(0), c.sampleRate);
  src.connect(proc); proc.connect(sink); sink.connect(c.destination);
  mic = { stream, src, proc, sink };
  playRef();
  requestAnimationFrame(recLoop);
}
function stopMic() {
  if (!mic) return;
  mic.stream.getTracks().forEach((t) => t.stop());
  mic.src.disconnect(); mic.proc.disconnect(); mic.sink.disconnect();
  mic = null;
}
function playRef() {
  const c = audio(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + 0.05;
  o.type = "sine"; o.frequency.value = C4;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t + 0.04);
  g.gain.setValueAtTime(0.3, t + 1.0); g.gain.linearRampToValueAtTime(0, t + 1.3);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + 1.35);
  refUntil = t + 1.5;
}
function onBlock(input, sr) {
  if (captured) return;
  const x = new Float32Array(input);
  ringWrite(x);
  const blockEnd = total, blockStart = total - x.length;
  if (audio().currentTime < refUntil) { latest = null; return; }
  const f = detectPitch(x, sr);
  latest = f ? { f, ...analyse(f) } : null;
  hist.push(latest ? latest.centsC : null); if (hist.length > 100) hist.shift();
  const good = latest && Math.abs(latest.centsC) <= TOL;
  if (good) {
    if (!runInfo) runInfo = { start: blockStart, end: blockEnd, freqs: [f], gap: 0 };
    else { runInfo.end = blockEnd; runInfo.freqs.push(f); runInfo.gap = 0; }
  } else if (runInfo && ++runInfo.gap > 2) finishRun(sr);
  if (runInfo && (runInfo.end - runInfo.start) / sr >= MAX_RUN) finishRun(sr);
}
function finishRun(sr) {
  const r = runInfo; runInfo = null;
  if (!r || (r.end - r.start) / sr < HOLD) return;
  const a = Math.max(total - ring.length, Math.floor(r.start - PRE * sr));
  const b = Math.min(total, Math.floor(r.end + POST * sr));
  const fs = r.freqs.slice().sort((p, q) => p - q);
  clip = makeClip(ringRead(a, b), sr, fs[Math.floor(fs.length / 2)], (r.start - a) / sr, (r.end - a) / sr);
  captured = true;
  stopMic();
  setStatus("取れました。これから名曲を台無しにします。", true);
  $("noteName").classList.add("ok"); $("noteName").textContent = "ド";
  setTimeout(() => { show("scPlay"); prepPlayer(); }, 1400);
}
function setStatus(t, ok) { const s = $("status"); s.textContent = t; s.classList.toggle("ok", !!ok); }

function recLoop() {
  if (captured) return;
  const cv = $("meter"), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = r.width, h = r.height;
  g.clearRect(0, 0, w, h);
  const y = (c) => h / 2 - Math.max(-1, Math.min(1, c / 100)) * (h / 2 - 6);
  g.fillStyle = css("--ok"); g.globalAlpha = 0.15; g.fillRect(0, y(TOL), w, y(-TOL) - y(TOL)); g.globalAlpha = 1;
  g.lineWidth = 3; g.lineCap = "round";
  const dx = w / 99, off = 100 - hist.length;
  for (let i = 1; i < hist.length; i++) {
    if (hist[i] == null || hist[i - 1] == null) continue;
    g.strokeStyle = Math.abs(hist[i]) <= TOL ? css("--ok") : css("--pink");
    g.beginPath(); g.moveTo((off + i - 1) * dx, y(hist[i - 1])); g.lineTo((off + i) * dx, y(hist[i])); g.stroke();
  }
  if (runInfo) { g.fillStyle = css("--ok"); g.fillRect(0, h - 5, w * Math.min(1, (runInfo.end - runInfo.start) / audio().sampleRate / HOLD), 5); }

  const n = $("noteName"), sub = $("noteSub");
  if (audio().currentTime < refUntil) { sub.textContent = "お手本を鳴らしています"; }
  else if (latest) {
    const good = Math.abs(latest.centsC) <= TOL, far = Math.abs(latest.centsC) > 50;
    n.textContent = latest.name; n.classList.toggle("ok", good);
    const c = Math.round(latest.centsC);
    sub.textContent = far ? `${latest.f.toFixed(0)} Hz` : `${c > 0 ? "+" : c < 0 ? "−" : "±"}${Math.abs(c)} セント · ${latest.f.toFixed(0)} Hz`;
    setStatus(runInfo ? "そのまま、そのまま…" : far ? (latest.centsC > 0 ? "それはドではありません。もう少し下です。" : "それはドではありません。もう少し上です。") : good ? "いい感じです。そのまま伸ばして。" : latest.centsC > 0 ? "ちょっと高いです。" : "ちょっと低いです。", good || !!runInfo);
  } else {
    n.classList.remove("ok"); sub.textContent = "聞いています";
    setStatus("ポーンと鳴った音に合わせて、まっすぐ伸ばしてください。");
  }
  requestAnimationFrame(recLoop);
}

// ---------- 声のクリップ ----------
let clip = null;
function makeClip(data, sr, f0, stableStart, stableEnd) {
  const s0 = Math.floor(stableStart * sr), s1 = Math.floor(stableEnd * sr);
  let peak = 0;
  for (let i = s0; i < s1; i++) peak = Math.max(peak, Math.abs(data[i]));
  const g = peak > 0 ? 0.9 / peak : 1;
  const out = new Float32Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = Math.max(-1, Math.min(1, data[i] * g));
  const fade = Math.floor(sr * 0.02);
  for (let i = 0; i < fade && i < out.length; i++) { out[i] *= i / fade; out[out.length - 1 - i] *= i / fade; }
  const buffer = audio().createBuffer(1, out.length, sr);
  buffer.copyToChannel(out, 0);
  const S = stableEnd - stableStart;
  let ls = Math.floor((stableStart + S * 0.25) * sr);
  for (let i = ls; i < ls + sr / f0 * 2 && i < out.length - 1; i++) { if (out[i] <= 0 && out[i + 1] > 0) { ls = i; break; } }
  const n = Math.max(1, Math.floor((S * 0.5 * sr) / (sr / f0)));
  return { buffer, f0, midi: 69 + 12 * Math.log2(f0 / 440), stableStart, loopStart: ls / sr, loopEnd: (ls + n * sr / f0) / sr };
}

// ---------- 曲とコーラス ----------
const STEMS = { vocal: "songs/doremi-vocal.m4a", bvox: "songs/doremi-bvox.m4a", drums: "songs/doremi-drums.m4a", other: "songs/doremi-other.m4a" };
const MIX = { vocal: 1, bvox: 0.8, drums: 0.8, other: 0.8, chorus: 1 };
const VOICES = 6, SPREAD = 8, REVERB = 0.35, MELODY_CENTER = 61;
const stems = {};
let chords = null, songReady = null;
function loadSong() {
  if (songReady) return songReady;
  songReady = Promise.all([
    ...Object.entries(STEMS).map(async ([k, url]) => { stems[k] = await audio().decodeAudioData(await (await fetch(url)).arrayBuffer()); }),
    fetch("songs/doremi-chords.json").then((r) => r.json()).then((j) => (chords = j.chords)),
  ]);
  return songReady;
}
// コードを3声に並べる。前のコードからなるべく動かない形を選ぶ
function chordPads() {
  const out = [];
  let prev = null;
  chords.forEach((c, i) => {
    const next = chords[i + 1];
    const tones = [0, c.q === "m" ? 3 : 4, 7].map((x) => (c.root + x) % 12);
    let best = null;
    for (let base = MELODY_CENTER - 9; base <= MELODY_CENTER + 3; base++) {
      const v = tones.map((pc) => base + ((pc - base) % 12 + 12) % 12).sort((a, b) => a - b);
      if (v[2] - v[0] > 9) continue;
      const cost = prev ? v.reduce((s, m, k) => s + Math.abs(m - prev[k]), 0) : Math.abs(v[1] - MELODY_CENTER);
      if (!best || cost < best.cost) best = { v, cost };
    }
    prev = best.v;
    const end = next && next.t - (c.t + c.d) < 0.6 ? next.t + 0.08 : c.t + c.d;
    for (const m of best.v) out.push({ t: c.t, d: end - c.t, m });
  });
  return out;
}
const irs = {};
function hallIR(c) {
  if (irs[c.sampleRate]) return irs[c.sampleRate];
  const sr = c.sampleRate, len = Math.floor(sr * 2.6), pre = Math.floor(sr * 0.02), b = c.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    for (let i = pre; i < len; i++) { const t = (i - pre) / sr; d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 2.6) * (1 - Math.exp(-t * 60)); }
  }
  return (irs[c.sampleRate] = b);
}
const voiceSet = [{ det: 0, dt: 0, pan: 0 }];
for (let i = 1; i < VOICES; i++) voiceSet.push({ det: (Math.random() * 2 - 1) * SPREAD, dt: Math.random() * 0.025, pan: (Math.random() * 2 - 1) * 0.8 });
function singNote(c, out, n, when, octShift) {
  const g0 = 0.6 / Math.sqrt(VOICES) * 0.5;
  const rate = Math.pow(2, (n.m + 12 * octShift - clip.midi) / 12);
  const offset = Math.max(0, clip.stableStart - 0.02);
  for (const v of voiceSet) {
    const t = when + v.dt;
    const src = c.createBufferSource();
    src.buffer = clip.buffer;
    src.playbackRate.value = rate;
    if (src.detune) src.detune.value = v.det + (Math.random() * 2 - 1) * 3;
    if (n.d + 0.4 > (clip.buffer.duration - offset) / rate) { src.loop = true; src.loopStart = clip.loopStart; src.loopEnd = clip.loopEnd; }
    const g = c.createGain(), atk = Math.min(0.15, n.d * 0.3), rel = 0.3;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(g0, t + atk);
    g.gain.setValueAtTime(g0, t + n.d);
    g.gain.linearRampToValueAtTime(0, t + n.d + rel);
    src.connect(g);
    if (c.createStereoPanner && v.pan) { const p = c.createStereoPanner(); p.pan.value = v.pan; g.connect(p); p.connect(out); }
    else g.connect(out);
    src.start(t, offset);
    src.stop(t + n.d + rel + 0.02);
  }
}

let pads = [], octShift = 0, player = null;
async function prepPlayer() {
  const btn = $("playBtn");
  try {
    await loadSong();
    pads = chordPads();
    const ms = pads.map((n) => n.m).sort((a, b) => a - b);
    octShift = Math.round((clip.midi - ms[Math.floor(ms.length / 2)]) / 12);
    $("time").textContent = `0:00 / ${fmt(stems.vocal.duration)}`;
    btn.disabled = false; btn.textContent = "再生";
  } catch (e) {
    console.error(e); btn.textContent = "曲を読み込めませんでした";
  }
}
function play() {
  const c = audio(); c.resume();
  const master = c.createGain(), comp = c.createDynamicsCompressor();
  comp.threshold.value = -10; comp.ratio.value = 3;
  master.connect(comp); comp.connect(c.destination);
  const bus = c.createGain(), dry = c.createGain(), wet = c.createGain(), conv = c.createConvolver(), chorusOut = c.createGain();
  conv.buffer = hallIR(c);
  bus.connect(dry); dry.connect(chorusOut); bus.connect(conv); conv.connect(wet); wet.connect(chorusOut); chorusOut.connect(master);
  dry.gain.value = 1 - REVERB * 0.5; wet.gain.value = REVERB * 0.8; chorusOut.gain.value = MIX.chorus * 0.8;
  const t0 = c.currentTime + 0.15;
  const srcs = Object.keys(STEMS).map((k) => {
    const g = c.createGain(); g.gain.value = MIX[k]; g.connect(master);
    const s = c.createBufferSource(); s.buffer = stems[k]; s.connect(g); s.start(t0);
    return s;
  });
  player = { t0, srcs, master, bus, idx: 0 };
  const me = player;
  srcs[0].onended = () => { if (player === me) stop(); };
  player.timer = setInterval(tick, 30);
  tick();
  $("playBtn").textContent = "停止";
  requestAnimationFrame(progress);
}
function tick() {
  const p = player; if (!p) return;
  const c = audio();
  while (p.idx < pads.length && p.t0 + pads[p.idx].t < c.currentTime + 0.3) {
    const n = pads[p.idx++];
    singNote(c, p.bus, n, Math.max(p.t0 + n.t, c.currentTime), octShift);
  }
}
function stop() {
  if (!player) return;
  const p = player; player = null;
  clearInterval(p.timer);
  const c = audio(), t = c.currentTime;
  p.master.gain.setValueAtTime(1, t); p.master.gain.linearRampToValueAtTime(0, t + 0.08);
  setTimeout(() => { for (const s of p.srcs) { try { s.stop(); } catch {} } p.master.disconnect(); }, 150);
  $("playBtn").textContent = "再生";
  $("bar").style.width = "0";
  $("time").textContent = `0:00 / ${fmt(stems.vocal.duration)}`;
}
function progress() {
  if (!player) return;
  const dur = stems.vocal.duration, t = Math.max(0, audio().currentTime - player.t0);
  $("bar").style.width = Math.min(100, (t / dur) * 100) + "%";
  $("time").textContent = `${fmt(t)} / ${fmt(dur)}`;
  requestAnimationFrame(progress);
}

// 歌いたくない人向け：合成した「あー」（C4）で代用する
function synthSample() {
  const sr = audio().sampleRate, dur = 1.6, N = Math.floor(sr * dur);
  const data = new Float32Array(N);
  const F = [[800, 1, 90], [1150, 0.5, 100], [2900, 0.22, 150]];
  const H = Math.floor(4500 / C4), amps = [];
  for (let h = 1; h <= H; h++) { let a = 0; for (const [fc, g, bw] of F) a += g / (1 + ((C4 * h - fc) / bw) ** 2); amps.push((a + 0.02) / Math.sqrt(h)); }
  const ph = new Float64Array(H);
  for (let i = 0; i < N; i++) {
    const t = i / sr, f = C4 * (1 + (t > 0.45 ? 0.006 * Math.sin(2 * Math.PI * 5.2 * t) : 0));
    let s = 0;
    for (let h = 0; h < H; h++) { ph[h] += 2 * Math.PI * f * (h + 1) / sr; s += amps[h] * Math.sin(ph[h]); }
    data[i] = s * Math.min(1, t / 0.08) * Math.min(1, (dur - t) / 0.15) * 0.3;
  }
  return makeClip(data, sr, C4, 0.15, 1.42);
}
function useSample() {
  audio().resume();
  clip = synthSample();
  captured = true;
  loadSong();
  document.querySelector("#scPlay .songhead span").textContent = "with いらないコーラス（サンプルのド）";
  show("scPlay"); prepPlayer();
}

renderLyrics();
$("micBtn").onclick = startMic;
$("sampleBtn").onclick = useSample;
$("playBtn").onclick = () => (player ? stop() : play());
</script>
